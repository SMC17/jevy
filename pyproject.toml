[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-omm"
version = "0.1.0"
description = "Jev Options MM — research-grade options market-making engine (simulation/paper only)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Sean Collins" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pydantic>=2.5",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
typesafe = ["typesafe-sdk>=0.1", "httpx>=0.27"]

[project.scripts]
jev-omm-demo = "jev_omm.demo:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["jev_omm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
